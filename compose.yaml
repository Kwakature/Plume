# Développement (rechargement à chaud) :
#   docker compose up --build
# Le nom du projet est distinct de la production (compose.prod.yaml) pour que
# les deux ne se remplacent pas l'un l'autre sur la même machine.
name: plume-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true